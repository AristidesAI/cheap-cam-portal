###############################################
# cheap-cam-portal - MediaMTX config (generated)
# DO NOT EDIT THIS FILE BY HAND.
# Edit .env and re-run ./setup.sh (or ./regen-config.sh).

logLevel: info
logDestinations: [stdout]
readTimeout: 10s
writeTimeout: 10s

# We only need WebRTC out. Disable the other servers.
rtsp: no
rtmp: no
hls: no
srt: no

# WebRTC -> browser. Loopback only.
webrtc: yes
webrtcAddress: 127.0.0.1:{{WEBRTC_PORT}}
webrtcEncryption: no
webrtcAllowOrigins: ['*']
webrtcAdditionalHosts: [127.0.0.1, localhost]

# API/metrics off for simplicity.
api: no
metrics: no
pprof: no
playback: no

paths:
  cam:
    # Pull RTSP from your camera using TCP transport (mirrors
    # the `ffplay -rtsp_transport tcp` low-latency setup).
    source: rtsp://{{CAM_USER}}:{{CAM_PASS}}@{{CAM_IP}}:{{CAM_PORT}}/{{CAM_PATH}}
    rtspTransport: tcp
    # Keep pulling: reconnect automatically after a cam power-cycle.
    sourceOnDemand: no
